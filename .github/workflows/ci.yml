name: CI

on:
  push:
    branches:
      - master
      - 'cursor/**'
  pull_request:
    branches:
      - master

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Guards the PoS/non-PoS module boundary: any new edge that puts src/pos/
      # back into a cycle with the node fails here instead of silently landing.
      - name: Circular dependencies
        run: ./test/lint/lint-circular-dependencies.sh

  linux-unit-tests:
    name: Linux unit tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # GitHub runners may ship a Google Chrome apt source that fails during
          # mirror sync and breaks `apt-get update` (exit 100). Drop it and retry.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome*.list || true
          for attempt in 1 2 3; do
            if sudo apt-get update; then
              break
            fi
            echo "apt-get update failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 5))
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
          done
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake pkg-config bsdmainutils \
            curl git python3 bison tcl

      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: depends/built
          key: depends-${{ runner.os }}-${{ hashFiles('depends/packages/*.mk') }}
          restore-keys: depends-${{ runner.os }}-

      - name: Build depends (x86_64-linux-gnu)
        run: |
          cd depends
          make HOST=x86_64-linux-gnu FALLBACK_DOWNLOAD_PATH=https://bitcoincore.org/depends-sources -j"$(nproc)"

      - name: Build
        run: |
          ./autogen.sh
          CONFIG_SITE=$PWD/depends/x86_64-linux-gnu/share/config.site ./configure --prefix=/ --with-gui=qt5
          make -j"$(nproc)"

      - name: Unit tests
        run: |
          ./src/test/test_xpchain

      - name: Qt tests
        run: |
          export QT_QPA_PLATFORM=minimal
          export QT_DEBUG_PLUGINS=1
          ./src/qt/test/test_xpchain-qt -v2
        continue-on-error: false

  linux-functional-tests:
    name: Linux functional tests
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # Same Chrome apt-source flake as unit-test job (see above).
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome*.list || true
          for attempt in 1 2 3; do
            if sudo apt-get update; then
              break
            fi
            echo "apt-get update failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 5))
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
          done
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake pkg-config bsdmainutils \
            curl git python3 bison tcl

      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: depends/built
          key: depends-${{ runner.os }}-${{ hashFiles('depends/packages/*.mk') }}
          restore-keys: depends-${{ runner.os }}-

      - name: Build depends (x86_64-linux-gnu)
        run: |
          cd depends
          make HOST=x86_64-linux-gnu FALLBACK_DOWNLOAD_PATH=https://bitcoincore.org/depends-sources -j"$(nproc)"

      - name: Build
        run: |
          ./autogen.sh
          CONFIG_SITE=$PWD/depends/x86_64-linux-gnu/share/config.site ./configure --prefix=/ --with-gui=no
          make -j"$(nproc)"

      - name: Check that the functional suite is actually enabled
        run: |
          # test_runner.py exits early when test/config.ini says the wallet, utils or
          # daemon are missing. Fail here with a clear message instead of discovering it
          # as a zero-test run. See doc/architecture-separation-roadmap.md (P0-1).
          grep -q '^ENABLE_WALLET=true' test/config.ini
          grep -q '^ENABLE_UTILS=true' test/config.ini
          grep -q '^ENABLE_XPCHAIND=true' test/config.ini

      - name: Proof-of-stake functional test
        run: |
          python3 test/functional/test_runner.py feature_pos_staking.py

      - name: Wallet functional tests
        run: |
          python3 test/functional/test_runner.py \
            wallet_sqlite_encryption.py \
            wallet_sqlite_default.py \
            wallet_migrate_sqlite.py \
            wallet_mnemonic_bip44.py \
            wallet_mnemonic_rescan.py \
            wallet_encryption.py \
            wallet_backup.py \
            wallet_multiwallet.py \
            --jobs 2
